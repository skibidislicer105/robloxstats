<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <div class="card">

            <div class="brand">
                <div class="shield">✓</div>
                <span>Verification</span>
            </div>

            <h1>Complete verification</h1>

            <p class="intro">
                Follow the steps below to complete this demo verification.
            </p>


            <!-- STEP 1 -->

            <div class="step">

                <div class="step-number">
                    1
                </div>

                <div class="step-content">

                    <h2>
                        Copy your CAPTCHA code
                    </h2>

                    <div class="code-box">

                        <code id="captchaCode">
                            9462
                        </code>

                        <button id="copyButton">
                            Copy CAPTCHA
                        </button>

                    </div>

                    <p id="copyStatus"></p>

                </div>

            </div>


            <!-- STEP 2 -->

            <div class="step">

                <div class="step-number">
                    2
                </div>

                <div class="step-content">

                    <h2>
                        Press <kbd>Windows</kbd> + <kbd>R</kbd>
                    </h2>

                    <p>
                        Open the Windows Run dialog.
                    </p>

                </div>

            </div>


            <!-- STEP 3 -->

            <div class="step">

                <div class="step-number">
                    3
                </div>

                <div class="step-content">

                    <h2>
                        Paste your CAPTCHA code
                    </h2>

                    <p>
                        Paste your CAPTCHA code and press enter.
                    </p>

                </div>

            </div>


            <div class="demo-warning">
                VERIFICATION
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
